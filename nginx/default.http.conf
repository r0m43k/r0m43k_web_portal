gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

upstream frontend_app {
    server frontend:80;
    keepalive 32;
}

upstream backend_app {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name r0m43k.live www.r0m43k.live;

    proxy_request_buffering off;
    client_max_body_size 2048m;
    client_body_temp_path /srv/media/.nginx-client-body-temp 1 2;
    client_body_timeout 3600s;
    sendfile on;
    tcp_nopush on;
    aio threads;
    etag on;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache" always;
    }

    location ~* ^/(css|js)/ {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /admin/ {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_timeout 3600s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_timeout 3600s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    location ~* ^/media/hls/.+\.m3u8$ {
        root /srv;
        try_files $uri =404;
        types {
            application/vnd.apple.mpegurl m3u8;
        }
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control "public, max-age=15, stale-while-revalidate=60" always;
        add_header Accept-Ranges "bytes" always;
    }

    location ~* ^/media/hls/.+\.(ts|m4s)$ {
        root /srv;
        try_files $uri =404;
        types {
            video/mp2t ts;
            video/iso.segment m4s;
        }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Accept-Ranges "bytes" always;
    }

    location /media/raw/ {
        root /srv;
        try_files $uri =404;
        types {
            video/mp4 mp4;
            video/quicktime mov;
            video/webm webm;
        }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Accept-Ranges "bytes" always;
    }

    location /media/ {
        root /srv;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Accept-Ranges "bytes" always;
    }

    location /static/ {
        alias /srv/static/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
}
