server {
    listen 80;
    listen [::]:80;
    server_name r0m43k.live www.r0m43k.live;
    http2 off;

    proxy_request_buffering off;

    client_max_body_size 500m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name r0m43k.live www.r0m43k.live;

    client_max_body_size 500m;

    ssl_certificate     /etc/letsencrypt/live/r0m43k.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/r0m43k.live/privkey.pem;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        client_body_timeout 1200s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
        send_timeout 1200s;
    }


    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_request_buffering off;
        proxy_buffering off;

        client_body_timeout 1200s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
        send_timeout 1200s;
    }


    location /media/ { alias /srv/media/; autoindex off; }
    location /static/ { alias /srv/static/; autoindex off; }
}
