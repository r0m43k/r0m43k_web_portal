server {
    listen 80;
    listen [::]:80;
    server_name r0m43k.live www.r0m43k.live;

    client_max_body_size 500m;

    # Let's Encrypt challenge (оставляем и на 80)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # редирект на https
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name r0m43k.live www.r0m43k.live;

    client_max_body_size 500m;

    ssl_certificate     /etc/letsencrypt/live/r0m43k.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/r0m43k.live/privkey.pem;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /media/ { alias /srv/media/; autoindex off; }
    location /static/ { alias /srv/static/; autoindex off; }
}
