server {
    listen 80;
    listen [::]:80;
    server_name r0m43k.live www.r0m43k.live;
    http2 off;

    proxy_request_buffering off;
    client_body_buffer_size 512k;
    client_max_body_size 500m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name r0m43k.live www.r0m43k.live;
    client_max_body_size 500m;

    ssl_certificate     /etc/letsencrypt/live/r0m43k.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/r0m43k.live/privkey.pem;

    sendfile on;
    tcp_nopush on;
    aio threads;
    etag on;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_body_timeout 1200s;
        proxy_connect_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
        send_timeout 1200s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_buffering on;
        client_body_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        send_timeout 1800s;
    }

    location ~* ^/media/hls/.+\.m3u8$ {
        root /srv;
        try_files $uri =404;
        types {
            application/vnd.apple.mpegurl m3u8;
        }
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Accept-Ranges "bytes" always;
    }

    location ~* ^/media/hls/.+\.(ts|m4s)$ {
        root /srv;
        try_files $uri =404;
        types {
            video/mp2t ts;
            video/iso.segment m4s;
        }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Accept-Ranges "bytes" always;
    }

    location /media/raw/ {
        root /srv;
        try_files $uri =404;
        types {
            video/mp4 mp4;
            video/quicktime mov;
            video/webm webm;
        }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Accept-Ranges "bytes" always;
    }

    location /media/ {
        root /srv;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Accept-Ranges "bytes" always;
    }

    location /static/ {
        alias /srv/static/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
}
