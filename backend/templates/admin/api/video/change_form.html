{% extends "admin/change_form.html" %}
{% load static %}

{% block extrahead %}
  {{ block.super }}
  <script src="{% static 'api/admin/video_upload.js' %}"></script>
  <style>
    .upload-progress {
      margin: 12px 0 0;
      padding: 10px 12px;
      border: 1px solid #2b2f36;
      border-radius: 8px;
      background: #101216;
    }
    .upload-progress__bar {
      height: 6px;
      border-radius: 999px;
      background: #1f2229;
      overflow: hidden;
    }
    .upload-progress__bar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: #4c8bf5;
      transition: width .2s ease;
    }
    .upload-progress__text {
      margin-top: 6px;
      font-size: 12px;
      color: #c9d1d9;
    }
  </style>
{% endblock %}

{% block after_field_sets %}
  {{ block.super }}
  <div class="upload-progress" id="uploadProgress" style="display:none;">
    <div class="upload-progress__bar">
      <span id="uploadProgressBar"></span>
    </div>
    <div class="upload-progress__text" id="uploadProgressText">
      Загрузка 0%
    </div>
  </div>
{% endblock %}
