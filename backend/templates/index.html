<!DOCTYPE html>
<html>
<head>
    <title>Video Feed</title>
</head>
<body>

<h1>Video feed</h1>

{% for video in videos %}
    <h3>{{ video.title }}</h3>

    <video width="400" controls>docker compose exec backend sh -lc "ls -la /app/api/migrations && echo '---' && sed -n '1,200p' /app/api/migrations/0001_initial.py"

        <source src="{{ video.video.url }}" type="video/mp4">
    </video>

    <p>Likes: {{ video.likes.count }}</p>

    <hr>
{% empty %}
    <p>No videos yet</p>
{% endfor %}

</body>
</html>
