<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>r0m43k</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/hls.js@1.5.8" as="script" crossorigin />
  <link rel="stylesheet" href="/css/main.css?v=20260502-5" />
</head>
<body class="feed-page is-guest">

  <header class="topbar">
    <div class="topbar__actions">
      <span class="topbar__user btn" id="topbarUser" hidden></span>
      <a class="btn btn--ghost" href="/admin.html" id="adminBtn" hidden>Панель модерации</a>
      <a class="btn btn--ghost" href="/login.html" id="loginBtn">Войти</a>
      <button class="btn btn--ghost" id="logoutBtn" hidden>Выйти</button>
    </div>
  </header>

  <main class="feed" id="feed" aria-live="polite">

    <section class="post post--hero" id="heroPost">
      <div class="photo-carousel" id="photoCarousel" aria-label="Photo carousel">
        <div class="photo-carousel__track" id="photoCarouselTrack"></div>
        <div class="photo-carousel__dots" id="photoCarouselDots"></div>
      </div>

      <div class="post__ui">
        <div class="post__meta">
          <div class="post__title">Capturing the globe cinematically</div>
          <div class="post__sub">Developed by r0m43k</div>
          <div class="video-loader is-hidden" id="heroLoader">
            <div class="video-loader__bar" style="width: 0%"></div>
            <div class="video-loader__text">Загрузка видео 0%</div>
          </div>
        </div>

        <div class="post__actions"></div>
      </div>
    </section>
  </main>

  <div id="sentinel" class="sentinel"></div>

  <div class="modal is-hidden" id="commentsModal" role="dialog" aria-modal="true">
    <div class="modal__backdrop" data-action="close"></div>
    <div class="modal__panel" role="document">
      <div class="modal__header">
        <div class="modal__title">Комментарии</div>
        <button class="modal__close" type="button" data-action="close">✕</button>
      </div>
      <div class="modal__body">
        <div class="modal__list" id="commentsList"></div>
      </div>
      <div class="modal__footer">
        <form class="modal__form" id="commentForm">
          <input
            class="modal__input"
            name="text"
            placeholder="Написать комментарий..."
            maxlength="1000"
            autocomplete="off"
          />
          <button class="btn btn--primary" type="submit">Отправить</button>
        </form>
        <div class="modal__hint" id="commentHint"></div>
      </div>
    </div>
  </div>

  <script src="/js/auth.js?v=20260502-1"></script>
  <script src="/js/app.js?v=20260502-6"></script>
</body>
</html>
