<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Регистрация</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <h1 class="auth-title">Создать аккаунт</h1>
    <div class="auth-sub">Давайте познакомимся поближе</div>

    <form id="regForm" class="auth-form">
      <label class="field">
        <span>Ник</span>
        <input name="nickname" autocomplete="nickname" required />
      </label>

      <label class="field">
        <span>Email</span>
        <input name="email" type="email" autocomplete="email" required />
      </label>

      <label class="field">
        <span>Логин</span>
        <input name="username" autocomplete="username" required />
      </label>

      <label class="field">
        <span>Пароль</span>
        <input name="password" type="password" autocomplete="new-password" required />
      </label>

      <button class="btn btn--primary" type="submit">Создать аккаунт</button>
      <div class="auth-error" id="err"></div>
    </form>

    <div class="auth-links">
      <a href="/login.html">Уже есть аккаунт</a>
      <a href="/">На главную</a>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";

      const fd = new FormData(e.target);
      const nickname = fd.get("nickname");
      const email = fd.get("email");
      const username = fd.get("username");
      const password = fd.get("password");

      const res = await Auth.register(username, password, nickname, email);
      if (res.ok) {
        err.classList.add("is-success");
        err.textContent = "Письмо с подтверждением отправлено на email.";
      } else {
        err.classList.remove("is-success");
        err.textContent = res.detail || "Не удалось создать пользователя.";
      }
    });
  </script>
</body>
</html>
