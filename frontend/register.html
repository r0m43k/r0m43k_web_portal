<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Регистрация</title>
  <link rel="stylesheet" href="/css/main.css?v=20260225-2" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <h1 class="auth-title">Создать аккаунт</h1>
    <div class="auth-sub">Давайте познакомимся поближе</div>

    <form id="regForm" class="auth-form" novalidate>
      <label class="field">
        <span>Ник</span>
        <input name="nickname" autocomplete="nickname" required />
      </label>

      <label class="field">
        <span>Email</span>
        <input name="email" type="email" autocomplete="email" required />
      </label>

      <label class="field">
        <span>Пароль</span>
        <input name="password" type="password" autocomplete="new-password" required />
      </label>

      <label class="field">
        <span>Повторите пароль</span>
        <input name="password2" type="password" autocomplete="new-password" required />
      </label>

      <div class="auth-hints" id="passHints">
        <div class="auth-hint" data-rule="len">Минимум 8 символов</div>
        <div class="auth-hint" data-rule="match">Пароли совпадают</div>
      </div>

      <button class="btn btn--primary" type="submit">Создать аккаунт</button>
      <div class="auth-error" id="err"></div>
    </form>

    <div class="auth-links">
      <a href="/login.html">Уже есть аккаунт</a>
      <a href="/">На главную</a>
    </div>
  </div>

  <script src="/js/auth.js?v=20260225-2"></script>
  <script>
    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";

      const fd = new FormData(e.target);
      const nickname = (fd.get("nickname") || "").trim();
      const email = (fd.get("email") || "").trim();
      const password = fd.get("password") || "";
      const password2 = fd.get("password2") || "";

      passTouched = true;
      pass2Touched = true;
      updateHints();

      const issues = [];
      if (password.length < 8) issues.push("Пароль должен быть не короче 8 символов.");
      if (password !== password2) issues.push("Пароли не совпадают.");
      if (!email) issues.push("Введите email.");
      if (!nickname) issues.push("Введите ник.");

      if (issues.length) {
        err.classList.remove("is-success");
        err.textContent = issues[0];
        return;
      }

        const res = await Auth.register(password, nickname, email);
        if (res.ok) {
          err.classList.add("is-success");
          if (res.data?.verify_required === false) {
            err.textContent = "Письмо отправлено. Можно входить.";
            setTimeout(() => {
              location.href = "/login.html";
            }, 800);
          } else {
            err.textContent = "Письмо с подтверждением отправлено на email.";
          }
        const verifyUrl = res.data?.verify_url;
        if (verifyUrl && res.data?.verify_required !== false) {
          const br = document.createElement("br");
          const link = document.createElement("a");
          link.href = verifyUrl;
          link.textContent = "Подтвердить email";
          link.target = "_blank";
          link.rel = "noopener";
          err.appendChild(br);
          err.appendChild(link);
        }
      } else {
        err.classList.remove("is-success");
        err.textContent = res.detail || "Не удалось создать пользователя.";
      }
    });

    const emailInput = document.querySelector('input[name="email"]');
    const passInput = document.querySelector('input[name="password"]');
    const pass2Input = document.querySelector('input[name="password2"]');
    const hints = document.getElementById("passHints");
    const lenHint = hints?.querySelector('[data-rule="len"]');
    const matchHint = hints?.querySelector('[data-rule="match"]');
    const LEN_TEXT = "\u041c\u0438\u043d\u0438\u043c\u0443\u043c 8 \u0441\u0438\u043c\u0432\u043e\u043b\u043e\u0432";
    const MATCH_OK_TEXT = "\u041f\u0430\u0440\u043e\u043b\u0438 \u0441\u043e\u0432\u043f\u0430\u0434\u0430\u044e\u0442";
    const MATCH_ERR_TEXT = "\u041f\u0430\u0440\u043e\u043b\u0438 \u043d\u0435 \u0441\u043e\u0432\u043f\u0430\u0434\u0430\u044e\u0442";
    let passTouched = false;
    let pass2Touched = false;

    function setHintState(el, options) {
      if (!el) return;
      const show = Boolean(options?.show);
      const ok = Boolean(options?.ok);
      const error = Boolean(options?.error);
      el.classList.toggle("is-visible", show);
      el.classList.toggle("is-ok", show && ok);
      el.classList.toggle("is-error", show && error);
      if (show && options?.text) {
        el.textContent = options.text;
      }
    }

    function updateHints() {
      if (!hints) return;
      const pass = passInput?.value || "";
      const pass2 = pass2Input?.value || "";
      const lenOk = pass.length >= 8;
      const matchOk = pass.length > 0 && pass === pass2;

      if (passTouched) {
        if (lenOk) {
          setHintState(lenHint, { show: false });
        } else {
          setHintState(lenHint, {
            show: true,
            error: true,
            text: LEN_TEXT,
          });
        }
      } else {
        setHintState(lenHint, { show: false });
      }

      if (pass2Touched) {
        if (matchOk) {
          setHintState(matchHint, {
            show: true,
            ok: true,
            text: MATCH_OK_TEXT,
          });
        } else {
          setHintState(matchHint, {
            show: true,
            error: true,
            text: MATCH_ERR_TEXT,
          });
        }
      } else {
        setHintState(matchHint, { show: false });
      }
    }

    if (passInput) {
      passInput.addEventListener("focus", () => {
        passTouched = true;
        updateHints();
      });
      passInput.addEventListener("input", updateHints);
    }

    if (pass2Input) {
      pass2Input.addEventListener("focus", () => {
        pass2Touched = true;
        updateHints();
      });
      pass2Input.addEventListener("input", updateHints);
    }

    if (emailInput) {
      emailInput.addEventListener("input", () => {
        const cleaned = emailInput.value
          .replace(/[^a-zA-Z0-9@._+-]/g, "")
          .replace(/\\s+/g, "")
          .toLowerCase();
        if (cleaned !== emailInput.value) emailInput.value = cleaned;
      });
    }
  </script>
</body>
</html>
