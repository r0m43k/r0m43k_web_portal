<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Регистрация</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <h1 class="auth-title">Регистрация</h1>

    <form id="regForm" class="auth-form">
      <label class="field">
        <span>Логин</span>
        <input name="username" autocomplete="username" required />
      </label>

      <label class="field">
        <span>Пароль</span>
        <input name="password" type="password" autocomplete="new-password" required />
      </label>

      <button class="btn btn--primary" type="submit">Создать</button>
      <div class="auth-error" id="err"></div>
    </form>

    <div class="auth-links">
      <a href="/login.html">Уже есть аккаунт</a>
      <a href="/">На главную</a>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";

      const fd = new FormData(e.target);
      const username = fd.get("username");
      const password = fd.get("password");

      const ok = await Auth.register(username, password);
      if (ok) location.href = "/login.html";
      else err.textContent = "Не удалось создать пользователя (возможно, логин занят).";
    });
  </script>
</body>
</html>
