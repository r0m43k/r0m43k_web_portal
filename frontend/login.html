<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Вход</title>
  <link rel="stylesheet" href="/css/main.css?v=20260204" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <h1 class="auth-title">Добро пожаловать</h1>
    <div class="auth-sub" id="loginNote">Войдите в аккаунт</div>

    <form id="loginForm" class="auth-form">
      <label class="field">
        <span>Email, логин или никнейм</span>
        <input name="login" autocomplete="username" required />
      </label>

      <label class="field">
        <span>Пароль</span>
        <input name="password" type="password" autocomplete="current-password" required />
      </label>

      <button class="btn btn--primary" type="submit">Войти</button>
      <div class="auth-error" id="err"></div>
    </form>

    <div class="auth-links">
      <a href="/register.html">Создать аккаунт</a>
      <a href="/">На главную</a>
    </div>
  </div>

  <script src="/js/auth.js?v=20260204"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";

      const fd = new FormData(e.target);
      const login = (fd.get("login") || "").trim();
      const password = fd.get("password") || "";

      const res = await Auth.login(login, password);
      if (res.ok) location.href = "/";
      else err.textContent = res.detail || "Неверный логин/пароль.";
    });

    const note = document.getElementById("loginNote");
    const params = new URLSearchParams(window.location.search);
    if (params.get("verified") === "1") {
      note.textContent = "Email подтвержден. Можно входить.";
    } else if (params.get("verified") === "0") {
      note.textContent = "Ссылка подтверждения недействительна.";
    }
  </script>
</body>
</html>
