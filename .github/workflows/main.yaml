name: Main workflow

on:
  push:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install flake8==6.0.0

      - name: Run flake8 on backend
        run: python -m flake8 backend/templates/

  build_and_push_backend_to_docker_hub:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/r0m43k_web_portal-backend:latest

  build_and_push_frontend_to_docker_hub:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/r0m43k_web_portal-frontend:latest

  build_gateway_and_push_to_docker_hub:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./nginx/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/r0m43k_web_portal-gateway:latest

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_and_push_backend_to_docker_hub
      - build_and_push_frontend_to_docker_hub
      - build_gateway_and_push_to_docker_hub

    steps:
      - uses: actions/checkout@v3

      - name: Copy docker-compose.production.yml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.production.yml"
          target: "/home/${{ secrets.USERNAME }}/DroneHub"

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail

            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-v2
            sudo systemctl enable --now docker || true

            mkdir -p /home/${{ secrets.USERNAME }}/DroneHub
            cd /home/${{ secrets.USERNAME }}/DroneHub

            cat > .env <<'EOF'
            ENV=prod
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=postgres
            POSTGRES_PORT=5432

            SECRET_KEY=${{ secrets.DJANGO_KEY }}

            ALLOWED_HOSTS=r0m43k.live,www.r0m43k.live,${{ secrets.HOST }},localhost,127.0.0.1
            CSRF_TRUSTED_ORIGINS=https://r0m43k.live,https://www.r0m43k.live,http://${{ secrets.HOST }}

            DJANGO_SETTINGS_MODULE=config.settings

            SUPERUSER_USERNAME=${{ secrets.ADMIN_USERNAME }}
            SUPERUSER_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            EOF

            sudo docker compose -f docker-compose.production.yml pull
            sudo docker compose -f docker-compose.production.yml down
            sudo docker compose -f docker-compose.production.yml up -d

            # Убираем любые “висящие” certbot контейнеры (чтобы не было "Another instance")
            sudo docker rm -f dronehub-certbot-1 2>/dev/null || true

            # Если сертификата нет — получить
            if [ ! -f "$(sudo docker volume inspect -f '{{.Mountpoint}}' dronehub_certbot_conf)/live/r0m43k.live/fullchain.pem" ]; then
              sudo docker compose -f docker-compose.production.yml --profile certbot run --rm certbot \
                certonly --webroot --webroot-path=/var/www/certbot \
                -d r0m43k.live -d www.r0m43k.live \
                --email ${{ secrets.CERTBOT_EMAIL }} --agree-tos --no-eff-email --non-interactive

              sudo docker compose -f docker-compose.production.yml restart gateway
            else
              sudo docker compose -f docker-compose.production.yml restart gateway
            fi

            sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate
            sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput

            ADMIN_USERNAME="${{ secrets.ADMIN_USERNAME }}"
            ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"
            sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py shell -c "from django.contrib.auth.models import User; u, _ = User.objects.get_or_create(username='$ADMIN_USERNAME'); u.is_superuser=True; u.is_staff=True; u.set_password('$ADMIN_PASSWORD'); u.save()"

  post_deploy_tests:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check HTTPS returns something
        run: |
          curl -kIsS "https://${{ secrets.HOST }}/" | head -n 1 | grep -qE "200|301|302"

  telegram-notify:
    runs-on: ubuntu-latest
    needs: post_deploy_tests
    steps:
      - uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "все готово))"
