name: Main workflow

on:
  push:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install flake8==6.0.0

      - name: Run flake8 on backend
        run: python -m flake8 backend/

  build_and_push_backend_to_docker_hub:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/r0m43k_web_portal-backend:latest

  build_and_push_frontend_to_docker_hub:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/r0m43k_web_portal-frontend:latest

  build_gateway_and_push_to_docker_hub:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./nginx/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/r0m43k_web_portal-gateway:latest

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs:
      - build_and_push_backend_to_docker_hub
      - build_and_push_frontend_to_docker_hub
      - build_gateway_and_push_to_docker_hub

    steps:
      - uses: actions/checkout@v3

      - name: Copy docker-compose.production.yml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.production.yml"
          target: "/home/${{ secrets.USERNAME }}/DroneHub"

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 120s
          command_timeout: 180m
          script: |
            set -euo pipefail

            command -v docker >/dev/null 2>&1 || {
              sudo apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-v2
              sudo systemctl enable --now docker || true
            }

            echo "Pruning unused Docker data to free disk space..."
            sudo docker system prune -f || true

            DEPLOY_DIR="/home/${{ secrets.USERNAME }}/DroneHub"
            COMPOSE_FILE="$DEPLOY_DIR/docker-compose.production.yml"

            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            sudo ln -sfn "$DEPLOY_DIR" /root/DroneHub || true
            sudo ln -sfn "$COMPOSE_FILE" /root/docker-compose.production.yml || true

            cat > .env <<'EOF'
            ENV=prod
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=postgres
            POSTGRES_PORT=5432

            SECRET_KEY=${{ secrets.DJANGO_KEY }}

            ALLOWED_HOSTS=r0m43k.live,www.r0m43k.live,${{ secrets.HOST }},localhost,127.0.0.1
            CSRF_TRUSTED_ORIGINS=https://r0m43k.live,https://www.r0m43k.live,http://${{ secrets.HOST }}

            DJANGO_SETTINGS_MODULE=config.settings

            SUPERUSER_USERNAME=${{ secrets.ADMIN_USERNAME }}
            SUPERUSER_PASSWORD=${{ secrets.ADMIN_PASSWORD }}

            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
            EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
            EMAIL_USE_TLS=${{ secrets.EMAIL_USE_TLS }}
            DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}

            HLS_SEGMENT_SECONDS=2
            HLS_HEIGHT=1080
            HLS_HEIGHT_LOW=720
            HLS_MAXRATE=6000k
            HLS_BUFSIZE=12000k
            HLS_MAXRATE_LOW=3000k
            HLS_BUFSIZE_LOW=6000k
            HLS_CRF=21
            HLS_CRF_LOW=23
            HLS_PRESET=slow
            HLS_AUDIO_BITRATE=160k
            HLS_PROFILE=high
            HLS_LEVEL=4.1
            HLS_GOP=60
            HLS_FORCE_REENCODE=1
            EOF

            sudo ln -sfn "$DEPLOY_DIR/.env" /root/.env || true

            sudo docker compose -f "$COMPOSE_FILE" pull
            sudo docker compose -f "$COMPOSE_FILE" down
            sudo docker compose -f "$COMPOSE_FILE" up -d postgres backend frontend gateway

            echo "Waiting for Postgres..."
            ready=0
            for i in {1..30}; do
              if sudo docker compose -f "$COMPOSE_FILE" exec -T postgres pg_isready -U "${{ secrets.POSTGRES_USER }}" -d "${{ secrets.POSTGRES_DB }}" >/dev/null 2>&1; then
                echo "Postgres is ready!"
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "Postgres is not ready. Dumping compose status and logs."
              sudo docker compose -f "$COMPOSE_FILE" ps
              sudo docker compose -f "$COMPOSE_FILE" logs --tail=200 postgres || true
              exit 1
            fi

            sudo docker compose -f "$COMPOSE_FILE" exec -T backend python manage.py migrate
            sudo docker compose -f "$COMPOSE_FILE" exec -T backend python manage.py collectstatic --noinput

            sudo docker compose -f "$COMPOSE_FILE" up -d media-worker
            sudo docker compose -f "$COMPOSE_FILE" restart backend gateway

            if [ ! -f "$(sudo docker volume inspect -f '{{.Mountpoint}}' dronehub_certbot_conf)/live/r0m43k.live/fullchain.pem" ]; then
              sudo docker compose -f "$COMPOSE_FILE" --profile certbot run --rm certbot \
                certonly --webroot --webroot-path=/var/www/certbot \
                -d r0m43k.live -d www.r0m43k.live \
                --email ${{ secrets.CERTBOT_EMAIL }} --agree-tos --no-eff-email --non-interactive

              sudo docker compose -f "$COMPOSE_FILE" restart gateway
            else
              sudo docker compose -f "$COMPOSE_FILE" --profile certbot run --rm certbot \
                renew --webroot --webroot-path=/var/www/certbot --no-random-sleep-on-renew
              sudo docker compose -f "$COMPOSE_FILE" restart gateway
            fi

            sudo docker compose -f "$COMPOSE_FILE" up -d certbot-renew

            ADMIN_USERNAME="${{ secrets.ADMIN_USERNAME }}"
            ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"
            sudo docker compose -f "$COMPOSE_FILE" exec -T backend python manage.py shell -c "from django.contrib.auth.models import User; u, _ = User.objects.get_or_create(username='$ADMIN_USERNAME'); u.is_superuser=True; u.is_staff=True; u.set_password('$ADMIN_PASSWORD'); u.save()"

  post_deploy_tests:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check HTTPS returns something
        run: |
          curl -IsS "https://${{ secrets.HOST }}/" | head -n 1 | grep -qE "200|301|302"
      - name: Check public endpoints
        run: |
          set -euo pipefail
          base="https://${{ secrets.HOST }}"
          checks=(
            "/ 200|301|302"
            "/admin/ 200|301|302|403"
            "/api/health/ 200"
            "/api/hero/ 200|404"
            "/api/videos/ 200"
            "/api/auth/csrf/ 200"
            "/api/auth/me/ 200|401"
          )
          for item in "${checks[@]}"; do
            path="${item%% *}"
            code_re="${item#* }"
            status=$(curl -sS -o /dev/null -w "%{http_code}" "$base$path")
            echo "$path -> $status"
            echo "$status" | grep -qE "^(${code_re})$"
          done

  telegram-notify:
    runs-on: ubuntu-latest
    needs: post_deploy_tests
    steps:
      - uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "все готово))"
